
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | MEDI HABARI</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="login-container">

    <a href="../index.html" class="brand">
        <img class="brand-logo" src="../assets/medi-habari-logo.jpg" alt="MEDI HABARI logo">
        <span>
            <strong>MEDI HABARI</strong>
            <small>ADMIN PORTAL</small>
        </span>
    </a>

    <div class="login-card">
        <div class="login-icon"><img src="../assets/medi-habari-logo.jpg" alt="MEDI HABARI logo"></div>

        <h1>Karibu tena</h1>
        <p>Ingia kusimamia habari na matukio.</p>

        <form id="loginForm">

            <label>Email Address</label>
            <input type="email" id="email"
            placeholder="Admin email" required>

            <label>Password</label>
            <input type="password" id="password"
            placeholder="Password" required>

            <button type="submit" id="loginButton">
                INGIA KWENYE DASHBOARD
            </button>

            <div id="message"></div>

        </form>

        <a href="../index.html" class="back-link">
            ← Rudi kwenye tovuti
        </a>
    </div>

    <footer>© 2026 MEDI HABARI HABARI NA MATUKIO</footer>

</div>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
